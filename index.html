*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}

.bubble{position:absolute;bottom:-130px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),var(--c) 65%,rgba(255,255,255,.25));opacity:.85;animation:rise var(--t) linear forwards;z-index:3}
.bubble.popped{animation:none;transform:scale(1.6);opacity:0;transition:.25s}
@keyframes rise{to{transform:translateY(-125vh) translateX(var(--x))}}
.twinkle{position:absolute;font-size:24px;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{transform:scale(1.5) rotate(20deg);opacity:.4}}
.heart{position:absolute;font-size:34px;animation:up 1.3s forwards;pointer-events:none;z-index:4}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* Real recordings: put sounds/cat.mp3, sounds/dog.mp3 ... in the repo. If a file exists it is used, otherwise the built-in cartoon sound plays. */
var REAL = {};
function loadReal() {
  var a = ctx(); if (!a || !window.fetch) return;
  Object.keys(A).forEach(function (k) {
    fetch('sounds/' + k + '.mp3').then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(function (b) { return new Promise(function (ok, no) { var pr = a.decodeAudioData(b, ok, no); if (pr && pr.catch) pr.catch(function () {}); }); })
      .then(function (buf) { REAL[k] = buf; })
      .catch(function () {});
  });
}
function hasSound(k) { return !!(REAL[k] || SND[k]); }
/* plays the animal's sound (real if available) and returns its length in ms */
function playSnd(k) {

      var a = ctx();
      try { var src = a.createBufferSource(); src.buffer = REAL[k]; src.connect(a.destination); src.start(); } catch (e) {}
    }
    return Math.min(REAL[k].duration * 1000, 4000);

}
function speak(text) {

  } catch (e) {}
}

try { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); } catch (e) {}

function reactAnimal(t) {
  restart(t, 'right');
  var k = t.dataset.k;
  if (hasSound(k)) playSnd(k); else pop();
  var box = $('#baby'), r = t.getBoundingClientRect(), b = box.getBoundingClientRect();
  for (var i = 0; i < 3; i++) {
    var h = document.createElement('span');
    h.className = 'heart'; h.textContent = pick(['💖', '💕', '✨']);
    h.style.left = (r.left - b.left + rand(Math.max(30, r.width))) + 'px';
    h.style.top = (r.top - b.top - 10) + 'px';
    box.appendChild(h);
    (function (el) { setTimeout(function () { el.remove(); }, 1400); })(h);
  }
}

function repeatPrompt() {
  if (screen === 'find' && fd.k) speak('Where is the ' + A[fd.k].n + '?');
  else if (screen === 'colors' && cl.i >= 0) speak('Tap ' + COLORS[cl.i].n + '!');
}

/* ---------- navigation ---------- */
var screen = 'home';
function render() {
  $('#homeBtn').style.visibility = screen === 'home' ? 'hidden' : 'visible';
  if (screen === 'home') main.innerHTML = viewHome();
  else if (screen === 'learn') main.innerHTML = viewLearn();
  else if (screen === 'sounds') main.innerHTML = viewSounds();
  else if (screen === 'abc') main.innerHTML = viewAbc();
  else if (screen === 'songs') main.innerHTML = viewSongs();
  else if (screen === 'baby') { main.innerHTML = viewBaby(); startBaby(); }
  else if (screen === 'count') startCount();
  else if (screen === 'find') startFind();
  else if (screen === 'colors') startColors();
  window.scrollTo(0, 0);
  main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
}
function go(s, push) {
  timers.forEach(clearTimeout); timers = [];
  stopBaby(); tok++; songTok++;
  stopSpeech(); hideBanner();
  $('#modal').classList.remove('show');
  screen = s;
  if (push !== false) { try { history.pushState({ s: s }, ''); } catch (e) {} }
  render();
}

/* ---------- events ---------- */
var H = {
  go:     function (t) { pop(); go(t.dataset.to); },
  home:   function ()  { pop(); go('home'); },
  mute:   toggleMute,
  hello:  function (t) { restart(t, 'right'); pop(); speak('Hello! Let us play!'); },
  learn:  function (t) { openAnimal(t.dataset.k); },
  close:  closeModal,
  replay: replay,
  next:   nextAnimal,
  sound:  playCard,
  pet:    petTap,
  num:    numTap,
  find:   findTap,
  color:  colorTap,
  again:  repeatPrompt,
  letter: function (t) { openLetter(parseInt(t.dataset.i, 10)); },
  lnext:  function ()  { openLetter(curL + 1); },
  lprev:  function ()  { openLetter(curL - 1); },
  lsay:   sayLetter,
  song:   function (t) { openSong(parseInt(t.dataset.i, 10)); },
  songplay: function (t) { playSong(parseInt(t.dataset.i, 10)); },
  bubble: popBubble,
  react:  reactAnimal
};
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-a]');
  if (!t) return;
  ctx(); /* unlock audio on first touch */
  var f = H[t.dataset.a];
  if (f) { try { f(t); } catch (err) { console.error(err); } }
});
window.addEventListener('popstate', function (e) { go((e.state && e.state.s) || 'home', false); });

/* ---------- start ---------- */
try { history.replaceState({ s: 'home' }, ''); } catch (e) {}
setMuteIcon();
updateStars();
render();
setTimeout(function () { var sp = $('#splash'); sp.classList.add('hide'); setTimeout(function () { sp.remove(); }, 600); }, 1500);
loadReal();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
